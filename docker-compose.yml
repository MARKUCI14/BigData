services:
  # --- Zookeeper (required by Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Apache Kafka ---
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    expose:
      - "29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168  # 7 days
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- Kafka topic initialization ---
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        set -e;
        echo 'Creating Kafka topic: butterfly-observations...';
        kafka-topics --create --if-not-exists --bootstrap-server kafka:29092
        --topic butterfly-observations --partitions 3 --replication-factor 1
        --config retention.ms=604800000;
        echo 'Topic created successfully.';
        kafka-topics --describe --bootstrap-server kafka:29092 --topic butterfly-observations
    networks:
      - bigdata-net

  # --- MongoDB ---
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Spark Master ---
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: clouded-apollo-spark:3.5.3
    container_name: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_CONF_DIR=/opt/spark/conf
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=butterfly-observations
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DATABASE=bigdata
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/spark/app/data
      - ./src:/opt/spark/app/src
      - ./config:/opt/spark/app/config
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8080', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- Spark Worker ---
  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: clouded-apollo-spark:3.5.3
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --host
      - spark-worker
      - --port
      - "7078"
      - --webui-port
      - "8081"
      - --cores
      - "2"
      - --memory
      - 2g
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf
    ports:
      - "8081:8081"
    volumes:
      - ./data:/opt/spark/app/data
      - ./src:/opt/spark/app/src
      - ./config:/opt/spark/app/config
      - ./config/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    networks:
      - bigdata-net
    healthcheck:
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8081', timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- Streamlit Dashboard ---
  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    container_name: streamlit
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DATABASE=bigdata
      - KAFKA_BROKER=kafka:29092
    volumes:
      - ./src/dashboard:/app/dashboard
      - ./src/storage:/app/storage
    networks:
      - bigdata-net

networks:
  bigdata-net:
    driver: bridge
    name: bigdata-net

volumes:
  kafka-data:
    name: bigdata-kafka-data
  mongodb-data:
    name: bigdata-mongodb-data
