name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  whitespace:
    name: Check patch whitespace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch for whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"..."${{ github.sha }}"
