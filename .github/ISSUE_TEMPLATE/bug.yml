name: Bug report
description: Report incorrect behavior in an implemented pipeline, data transform, or dashboard.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Check existing issues and include only data you are allowed to share. Never include credentials or private records.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Include commands, configuration names (not secret values), and a minimal example.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment and data context
      description: Component, versions if known, source period, and relevant data/schema details. Do not attach restricted data.
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: text
