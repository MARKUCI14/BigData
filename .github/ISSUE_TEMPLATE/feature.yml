name: Feature request
description: Propose a user-facing or pipeline capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Need or use case
      description: Who needs this capability and what should it help them do?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: Use clear, verifiable outcomes.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Data, architecture, or dashboard impact
      description: Note input/output data, quality, scalability, and documentation implications.
