name: Architecture or design proposal
description: Propose or discuss a system, data, or research design decision.
title: "design: "
labels: ["design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Context and problem
      description: What need or constraint should this design address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Note effects on architecture, data model, reproducibility, course deliverables, or team responsibilities.
